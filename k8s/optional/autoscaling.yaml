# Optional: needs the Kubernetes metrics API and adequate node capacity.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: country-app
  namespace: country-integration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: country-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: country-app
  namespace: country-integration
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: country-app
