{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "country-prometheus",
    "namespace": "country-integration"
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "country-prometheus",
    "namespace": "country-integration"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "country-prometheus",
    "namespace": "country-integration"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "country-prometheus",
      "namespace": "country-integration"
    }
  ],
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "country-prometheus"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "country-prometheus",
    "namespace": "country-integration"
  },
  "data": {
    "prometheus.yml": "{\n  \"global\": {\n    \"scrape_interval\": \"15s\",\n    \"evaluation_interval\": \"15s\"\n  },\n  \"rule_files\": [\n    \"/etc/prometheus/rules.yml\"\n  ],\n  \"scrape_configs\": [\n    {\n      \"job_name\": \"country-app\",\n      \"metrics_path\": \"/actuator/prometheus\",\n      \"kubernetes_sd_configs\": [\n        {\n          \"role\": \"pod\",\n          \"namespaces\": {\n            \"names\": [\n              \"country-integration\"\n            ]\n          }\n        }\n      ],\n      \"relabel_configs\": [\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_label_app\"\n          ],\n          \"regex\": \"country-app\",\n          \"action\": \"keep\"\n        },\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_container_port_name\"\n          ],\n          \"regex\": \"http\",\n          \"action\": \"keep\"\n        },\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_name\"\n          ],\n          \"target_label\": \"pod\"\n        },\n        {\n          \"source_labels\": [\n            \"__meta_kubernetes_pod_name\"\n          ],\n          \"target_label\": \"instance\"\n        }\n      ]\n    }\n  ]\n}\n",
    "rules.yml": "{\n  \"groups\": [\n    {\n      \"name\": \"country-service\",\n      \"rules\": [\n        {\n          \"alert\": \"CountryApplicationUnavailable\",\n          \"expr\": \"sum(up{job=\\\"country-app\\\"}) < 1\",\n          \"for\": \"1m\",\n          \"labels\": {\n            \"severity\": \"critical\"\n          },\n          \"annotations\": {\n            \"summary\": \"No country application replica is scrapeable\"\n          }\n        },\n        {\n          \"alert\": \"CountryApplicationErrors\",\n          \"expr\": \"sum(rate(http_server_requests_seconds_count{job=\\\"country-app\\\",status=~\\\"5..\\\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\\\"country-app\\\"}[5m])),0.001) > 0.05\",\n          \"for\": \"2m\",\n          \"labels\": {\n            \"severity\": \"warning\"\n          },\n          \"annotations\": {\n            \"summary\": \"Country API 5xx rate exceeds five percent\"\n          }\n        }\n      ]\n    }\n  ]\n}\n"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "country-prometheus",
    "namespace": "country-integration"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "country-prometheus"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "country-prometheus"
        }
      },
      "spec": {
        "serviceAccountName": "country-prometheus",
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65534,
          "fsGroup": 65534
        },
        "containers": [
          {
            "name": "prometheus",
            "image": "prom/prometheus:v3.2.1",
            "args": [
              "--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.retention.time=6h"
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 9090
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "384Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/prometheus"
              },
              {
                "name": "data",
                "mountPath": "/prometheus"
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/-/ready",
                "port": "http"
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "country-prometheus"
            }
          },
          {
            "name": "data",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "country-prometheus",
    "namespace": "country-integration"
  },
  "spec": {
    "selector": {
      "app": "country-prometheus"
    },
    "ports": [
      {
        "name": "http",
        "port": 9090,
        "targetPort": "http"
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "country-grafana",
    "namespace": "country-integration"
  },
  "data": {
    "datasources.yaml": "{\n  \"apiVersion\": 1,\n  \"datasources\": [\n    {\n      \"name\": \"Country Prometheus\",\n      \"uid\": \"country-prometheus\",\n      \"type\": \"prometheus\",\n      \"access\": \"proxy\",\n      \"url\": \"http://country-prometheus:9090\",\n      \"isDefault\": true\n    }\n  ]\n}\n",
    "dashboards.yaml": "{\n  \"apiVersion\": 1,\n  \"providers\": [\n    {\n      \"name\": \"country\",\n      \"type\": \"file\",\n      \"disableDeletion\": true,\n      \"options\": {\n        \"path\": \"/var/lib/grafana/dashboards\"\n      }\n    }\n  ]\n}\n",
    "country-service.json": "{\"id\": null, \"uid\": \"country-service\", \"title\": \"Country service verification\", \"schemaVersion\": 39, \"version\": 1, \"refresh\": \"15s\", \"time\": {\"from\": \"now-30m\", \"to\": \"now\"}, \"panels\": [{\"id\": 1, \"title\": \"Ready scrape targets\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"country-prometheus\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 0}, \"targets\": [{\"expr\": \"sum(up{job=\\\"country-app\\\"})\", \"refId\": \"A\"}]}, {\"id\": 2, \"title\": \"HTTP requests / second\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"country-prometheus\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 0}, \"targets\": [{\"expr\": \"sum(rate(http_server_requests_seconds_count{job=\\\"country-app\\\"}[1m]))\", \"refId\": \"A\"}]}, {\"id\": 3, \"title\": \"HTTP p95 seconds\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"country-prometheus\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 8}, \"targets\": [{\"expr\": \"histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket{job=\\\"country-app\\\"}[5m])))\", \"refId\": \"A\"}]}, {\"id\": 4, \"title\": \"Country operation outcomes\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"country-prometheus\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 8}, \"targets\": [{\"expr\": \"sum by(operation,outcome)(country_operations_total)\", \"refId\": \"A\"}]}, {\"id\": 5, \"title\": \"Import duration seconds\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"country-prometheus\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 16}, \"targets\": [{\"expr\": \"sum(country_import_duration_seconds_sum) / clamp_min(sum(country_import_duration_seconds_count),1)\", \"refId\": \"A\"}]}]}"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "country-grafana",
    "namespace": "country-integration"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "country-grafana"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "country-grafana"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 472,
          "fsGroup": 472
        },
        "containers": [
          {
            "name": "grafana",
            "image": "grafana/grafana:12.0.1",
            "ports": [
              {
                "name": "http",
                "containerPort": 3000
              }
            ],
            "env": [
              {
                "name": "GF_AUTH_ANONYMOUS_ENABLED",
                "value": "true"
              },
              {
                "name": "GF_AUTH_ANONYMOUS_ORG_ROLE",
                "value": "Viewer"
              },
              {
                "name": "GF_AUTH_DISABLE_LOGIN_FORM",
                "value": "true"
              },
              {
                "name": "GF_AUTH_BASIC_ENABLED",
                "value": "false"
              },
              {
                "name": "GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION",
                "value": "true"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/datasources/datasources.yaml",
                "subPath": "datasources.yaml"
              },
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/dashboards/dashboards.yaml",
                "subPath": "dashboards.yaml"
              },
              {
                "name": "config",
                "mountPath": "/var/lib/grafana/dashboards/country-service.json",
                "subPath": "country-service.json"
              },
              {
                "name": "data",
                "mountPath": "/var/lib/grafana"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "http"
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "country-grafana"
            }
          },
          {
            "name": "data",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "country-grafana",
    "namespace": "country-integration"
  },
  "spec": {
    "selector": {
      "app": "country-grafana"
    },
    "ports": [
      {
        "name": "http",
        "port": 3000,
        "targetPort": "http"
      }
    ]
  }
}
