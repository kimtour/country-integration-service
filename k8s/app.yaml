apiVersion: v1
kind: ConfigMap
metadata:
  name: country-app-config
  namespace: country-integration
data:
  DB_URL: jdbc:mysql://mysql:3306/countrydb
  DB_USERNAME: countryapp
  COUNTRY_SOAP_URL: http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-app
  namespace: country-integration
spec:
  replicas: 2
  minReadySeconds: 15
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: country-app
  template:
    metadata:
      labels:
        app: country-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: country-integration-service:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: country-app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: country-app
  namespace: country-integration
spec:
  selector:
    app: country-app
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
