spring.application.name=country-integration-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/countrydb}
spring.datasource.username=${DB_USERNAME:countryapp}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false

country.soap.url=${COUNTRY_SOAP_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

logging.structured.format.console=ecs
management.metrics.tags.instance=${POD_NAME:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
